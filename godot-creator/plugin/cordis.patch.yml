# godot-creator-ui bundle patch — carries BOTH halves of the Godot Creator mode:
#
#   1. row `godot-creator-ui`     — the Host half (status route for the UI halves)
#   2. row `preset-godot-creator` — the Agent preset declaration
#   3. row `agent-preset-registry` — the default-preset selection (pre-update behaviour)
#
# Carrying the preset HERE (not in the profile patch layer) is deliberate: the DSH
# 0.2.1-rc.2 update rewrote the profile's cordis.patch.yml on 2026-10-18 and dropped the
# preset that had been appended there. A bundle patch survives profile rewrites and is
# installed/updated/removed through plugin_manager; the user's own profile patch still
# wins over everything declared here.
#
# The preset's plugin list mirrors the shipped `standard` preset of this DSH build
# (app.asar → dsh/node_modules/@deepseek-ai/dsh-web-app/presets/standard.patch.yml,
# DSH 0.2.2-rc.1) with these deviations: the persona rules, two skill roots (Godot +
# the harness-skills copy at dsh-plugins/harness-skills), the registry selection, `tool-plugin-manager`
# enabled (owner 2026-10-26: creation-mode permissions, since preset `cordis` cannot mount
# its delegation tools), and `tool-plugin-market` enabled (owner 2026-10-27: the Host now
# composes plugin-market from the installation-provided market bundle). After a DSH update,
# diff this list against that file — a renamed or removed plugin package fails the preset at activation.
#
# Host-half behaviour (all discovered, nothing version-pinned):
#   - Tool-surface policy is MODEL-DEPENDENT : strictly appenditive
#     context models (Deepseek) must not evict tools mid-session — slimming should pin
#     the surface via preload/core at session start; rolling deferred+search is for
#     models like glm that tolerate swap-in/out. Choose at session start, not runtime.
#   - port: read from the Addon's built-in DSH configuration ($DSH_HOME/cordis.patch.yml,
#     the `mcp-godot-ai` entry's `--port`); 4.3.0 moved it to 8001 and this followed.
#   - capability: Godot AI 4.3.0+ authenticates its HTTP transport; the token is read
#     from the addon's published `<capabilityDir>/http-<port>.json`. No file (older
#     servers) means the request goes out unauthenticated; a 401 forces one re-read.
#   - MCP session: Godot AI 4.3.0 caps concurrent sessions (32, idle-recycled after 30
#     minutes), so the host half holds ONE session and reuses it for every probe,
#     releases it on dispose, and backs off for `sessionLimitBackoffMs` after
#     MCP_SESSION_LIMIT_REACHED instead of hammering.
- insert:
    - id: godot-creator-ui
      name: godot-creator-ui
      config:
        # serverName: godot-ai          # which MCP entry to read the endpoint from
        # port: 8000                    # set only to pin a port; discovery is preferred
        # fallbackPort: 8000            # used only when no DSH configuration is found
        # statusPath: /godot-ai/status  # backend identity endpoint (optional enrichment)
        # mcpPath: /mcp                 # MCP streamable-HTTP endpoint
        # sessionTool: session_manage   # rename here if a future addon renames the tool
        # capabilityDir: <path>         # platform default; "" disables capability lookup
        # capabilityTtlMs: 60000        # re-read window for the published capability
        # sessionLimitBackoffMs: 60000  # quiet period after MCP_SESSION_LIMIT_REACHED
        # dshHome: <path>               # defaults to $DSH_HOME or ~/.dsh
        cacheTtlMs: 1500
        timeoutMs: 5000
    - id: agent-preset-registry
      name: '@deepseek-ai/dsh-agent-preset-registry'
      config:
        default: standard
        selectedDefault: godot-creator
    - id: preset-godot-creator
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: godot-creator
        name: Godot Creator
        description: Godot 创作模式：MCP 直连编辑器、按需技能与流程模板；先读后写、独立回读验证。
        order: 5
        plugins:
          # ---- 提示词：只写义务、方法、模式特征与环境事实；不写身份，不复述项目规则 ----
          - id: persona
            name: '@deepseek-ai/dsh-persona'
            config:
              prefix: "Model for this session: {{model}}."
              # 0.2.1-rc.2 起 cwd 不再是注册的提示词变量（注册的只剩 provider/model），
              # 工作目录改由 working-directory 服务的运行时上下文提供——模板里写 {{cwd}} 会让整轮渲染失败。
              # 系统注入一律英文：与工具说明、运行时上下文同一语言，避免中英混排。
              suffix: |
                Governing rules: the project AGENTS.md and the tool-constraint docs are the top authority; this block does not restate them — on conflict the project file wins.

                Working style: read before you write, close small loops; re-read independently before delivery, and never claim more than the evidence shows.

                Plugin authoring: write the bundle in the workspace, then install it with `plugin_manager` (approval required per call); never hand-edit the profile's package.json / cordis.patch.yml.

                Environment: the session is bound to a running Godot editor, which owns the scenes and assets; editor, run, and selection states are snapshots — re-check before writing; visual and runtime conclusions need a screenshot or log, otherwise state they are unverified.

          # ---- 以下清单按 DSH 0.2.2-rc.1 的 standard preset 对齐，仅 skill-filesystem 一行按本插件所在路径配置 ----
          - id: agent-instructions
            name: '@deepseek-ai/dsh-agent-instructions'
            config:
              maxBytes: 65536
            disabled: true
          - id: time-context
            name: '@deepseek-ai/dsh-time-context'
          - id: tool-bash
            name: '@deepseek-ai/dsh-tool-bash'
            disabled: !!js process.platform === 'win32'
          - id: tool-pwsh
            name: '@deepseek-ai/dsh-tool-pwsh'
            disabled: !!js process.platform !== 'win32'
          - id: tool-fs
            name: '@deepseek-ai/dsh-tool-fs'
          - id: tool-fs-search
            name: '@deepseek-ai/dsh-tool-fs-search'
            config:
              sampleOverCapGlobResults: false
          - id: tool-jobs
            name: '@deepseek-ai/dsh-tool-jobs'
          # Owner 2026-11-06：无定时任务需求，停用（定时任务只在 Owner 明确要求时建）。
          - id: tool-schedule
            name: '@deepseek-ai/dsh-tool-schedule'
            disabled: true
          - id: skill-filesystem
            name: '@deepseek-ai/dsh-skill-filesystem'
            config:
              # rank-600 fallback root. 2026-10-25 事故记录：曾用 `!!js process.env...||process.cwd()+...`
              # 做"去耦合"，但 !!js 是 Loader 表达式方言（ctx 服务调用，如 dshHomePath），
              # process 不可用 → skill-filesystem 挂载抛错，preset 激活链下游全灭
              # （新会话开不出 subagent、budget-watch 预警失效）。已回退字面量恢复功能；
              # 解耦待用受支持机制重做（TODO：向 vendor 确认 env/cwd 服务后迁移）。
              # 只挂合并后的单条技能：裸目录下 12 个领域技能已并入 sections/，
              # 指向子目录后它们不再各自成为技能条目（省目录上下文；旧文件留待清理）。
              bundledSkillDir: D:/游戏开发/项目/NFN Card/dsh-plugins/godot-creator/skills/godot-ai-orchestration
              # 创造模式技能根（owner 2026-10-26）：DSH 自带技能的项目内副本，逐字取自
              # app.asar 的 @deepseek-ai/dsh-agent-preset/skills（0.2.1-rc.3）。
              # 用项目副本而非 asar 路径：副本缺失时只少技能，不至于让 preset 激活失败。
              # 刷新方式见 dsh-plugins/harness-skills/PROVENANCE.md。
              customSkillDirs:
                - D:/游戏开发/项目/NFN Card/dsh-plugins/harness-skills
          - id: tool-skill
            name: '@deepseek-ai/dsh-tool-skill'
          - id: command-goal
            name: '@deepseek-ai/dsh-command-goal'
          - id: tool-goal
            name: '@deepseek-ai/dsh-tool-goal'
          - id: planning
            name: cordis:group
            group: true
            isolate:
              planMode: true
            config:
              # Owner 2026-11-06：plan mode / exit_plan_mode 目前不用，停用观察。
              - id: plan-mode
                name: '@deepseek-ai/dsh-plan-mode'
                disabled: true
                config:
                  section: |
                    You are in plan mode. Stay in plan mode until the user approves your plan through exit_plan_mode or switches the session mode. Imperative language to implement changes means plan the implementation, not execute it. A user's conversational agreement — including an answer confirming something you asked — approves nothing and does not end plan mode; fold the confirmed decision into the plan and submit it through exit_plan_mode.

                    Explore first. Use non-mutating reads, searches, static analysis, and checks to ground the plan in the actual repository. Do not edit or write files, change configuration, run formatters or code generation that rewrites tracked files, commit, or otherwise carry out the plan. Prefer existing functions and patterns over new machinery.

                    The tool catalog stays the same across modes for request-cache stability. These plan-mode rules override any later tool description or guidance that suggests using mutation tools; those tools remain listed to keep the tool catalog unchanged. Do not use todo_write to track this planning phase: it tracks implementation after an approved plan, while the plan itself belongs in exit_plan_mode.

                    Resolve discoverable facts by inspection. Use ask_user_question only for user-owned choices or material ambiguity that inspection cannot answer. Do not ask the user where code lives or how current behavior works when you can find out.

                    Make the plan decision-complete: state the goal and success criteria; group implementation changes by subsystem; identify public API, schema, and data-flow changes; cover edge cases, failure modes, tests, acceptance criteria, and explicit assumptions. Keep it concise enough to review but detailed enough that another engineer can implement it without making design decisions.

                    When ready, call exit_plan_mode with the complete plan markdown, starting with a # title. Make exit_plan_mode the only and final tool call in that assistant response: it presents the plan for approval, and implementation begins only in a later step after approval. Do not paste the final plan as a plain reply or ask "should I proceed?" through prose or ask_user_question. If review rejects it, incorporate the feedback and present again. If the review channel is unavailable or aborted, stay in plan mode and ask the user to switch modes manually; do not proceed with implementation.
          - id: compaction
            name: cordis:group
            group: true
            isolate:
              compaction: true
              toolResultPruner: true
            config:
              - id: compaction-basic
                name: '@deepseek-ai/dsh-compaction-basic'
              - id: command-compact
                name: '@deepseek-ai/dsh-command-compact'
              - id: tool-result-pruner
                name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
                config:
                  thresholdChars: 8192
                  headChars: 4096
                  tailChars: 1024
          - id: delegation
            name: cordis:group
            group: true
            isolate:
              workflowEngine: true
            config:
              - id: tool-subagent-control
                name: '@deepseek-ai/dsh-tool-subagent-control'
              # 0.2.2 起 list_agents 由 tool-subagent-control 主入口注册；
              # `dsh-tool-subagent-control/list-agents` 子路径已移除，保留会令 preset 激活时找不到模块。
              - id: tool-subagent
                name: '@deepseek-ai/dsh-tool-subagent'
                config:
                  provider: spawn
                  toolName: subagent
                  modelSelection: true
                  modelDiscovery: true
              # Owner 2026-11-06：fork 无使用场景，停用；spawn 型 subagent 与 list_agents 保留。
              - id: tool-subagent-fork
                name: '@deepseek-ai/dsh-tool-subagent'
                disabled: true
                config:
                  provider: fork
                  toolName: subagent_fork
              # OL1H 呼叫通道（0017 §8）：spawn 型 `subagent`（@deepseek-ai/dsh-subagent）与
              # `subagent-model-selection-settings` 由 **profile 层全局声明**，此处不得重复
              # 挂载——service 重复注册会报错。白名单（deepseek-flash 等）也在 profile 层。
              # Owner 2026-11-06：硬门是单 H（同一 subagentId 全程复用），并行编排通道停用。
              - id: workflow-ptc
                name: '@deepseek-ai/dsh-workflow-ptc'
                disabled: true
                config:
                  provider: spawn
              - id: tool-workflow
                name: '@deepseek-ai/dsh-tool-workflow'
                disabled: true
          # Owner 2026-11-06：改为完成一轮后统一决策，过程中不再问；ask_user_question 停用。
          - id: tool-ask-user
            name: '@deepseek-ai/dsh-tool-ask-user'
            disabled: true
          - id: tool-todo
            name: '@deepseek-ai/dsh-tool-todo'
            config:
              allowParallelInProgress: true
          # Owner 2026-11-06：只留 web_fetch；web_search 停用（检索需求走 pwsh 的 npm search）。
          - id: tool-web
            name: '@deepseek-ai/dsh-tool-web'
            config:
              search: false
              fetch: true
              searchTimeoutMs: 60000
          # PTC 工具面：PTC 能力由**预设作用域**直接挂 PTC 执行器拥有。
          # 0.2.2 起 `tool-presentation` 已弃用，`tools.mode` 已移除；按 Agent 作用域直接挂
          # `dsh-tool-executor-ptc` 是当前受支持接法。base bundle 已在全局挂 native 执行器，
          # 此处把本预设作用域覆盖为 PTC，旧会话不会被中途切换工具面。
          - id: godot-tool-executor-ptc
            name: '@deepseek-ai/dsh-tool-executor-ptc'
          - id: present
            name: '@deepseek-ai/dsh-tool-present'
          # 创造模式权限（owner 2026-10-26）：plugin_manager 是本 profile 唯一的插件安装/启停
          # 通道，cordis-plugin-development 的全部流程都依赖它。desktop profile 恒有
          # profileContext，故不加 !!js 守卫——该方言在本 bundle 层是否可执行未经证实，
          # 守卫抛错会让整个 preset 激活失败（新会话开不出来）。
          - id: tool-plugin-manager
            name: '@deepseek-ai/dsh-plugin-manager/tools'
          # 插件市场：宿主服务由 profile 的 @deepseek-ai/dsh-experimental-plugin-market-bundle 提供。
          # 该 bundle 的宿主行带 !!js 守卫（取不到 profileContext 时自关），且版本门会挡旧 peer：
          # 已用 set_version_exemption 放行 @deepseek-ai/dsh-plugin-market@0.2.1-rc.3 → 运行时 rc.5。
          # 此处只挂模型面工具行；宿主服务没挂载时该工具不会出现（工具随服务启停，是 bundle 的设计）。
          - id: tool-plugin-market
            name: '@deepseek-ai/dsh-plugin-market/tools'

# 署名：deepseek-flash ｜2026-10-16 ~ 2026-10-22
# 修订：deepseek-flash ｜2026-10-26（owner 裁定「为 godot-creator 开放创造插件的权限和工具」：
#   增加 customSkillDirs=D:/游戏开发/项目/工程/dsh-plugins/harness-skills（DSH 自带技能的项目内副本，
#   见该目录 PROVENANCE.md）、启用 tool-plugin-manager。起因：本构建里 preset `cordis` 的 spawn
#   委派实例装不上，`list_subagent_models` 因此注册不了（`.dsh/public/0002-OL1H卡.md` 的跨模型
#   探路断掉），创造类工作改到 godot-creator 下进行。）
